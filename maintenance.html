<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julian Marcoux</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#191d22;--muted:#5c6570;--line:#e4e7ea;--accent:#1d5f8f;--accent-soft:#eef4f9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Source Serif 4",Georgia,serif;color:var(--ink);background:#fff;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;line-height:1.65;
  }
  .card{max-width:480px}
  h1{font-family:Inter,sans-serif;font-weight:700;font-size:28px;letter-spacing:-.02em}
  .dot{
    width:10px;height:10px;border-radius:50%;background:var(--accent);
    display:inline-block;margin-bottom:22px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  .tagline{font-family:Inter,sans-serif;color:var(--muted);font-size:14.5px;margin-top:8px;line-height:1.5}
  p{margin-top:12px;color:var(--muted);font-size:17px}
  p.tagline{margin-top:8px}
  .contact{
    margin-top:26px;font-family:Inter,sans-serif;font-size:13.5px;font-weight:500;
    background:var(--accent-soft);border-radius:99px;padding:8px 18px;display:inline-block;
  }
  .contact a{color:var(--accent);text-decoration:none}
  .contact a:hover{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>Julian Marcoux</h1>
    <p class="tagline">PhD candidate in Economics · HEC Lausanne<br>Dartmouth Globalization PhD Fellow, Spring 2026</p>
    <p>A new version of this website is coming soon.</p>
    <p class="contact">In the meantime you can reach out to me at: <a href="mailto:julian.marcoux@unil.ch">julian.marcoux@unil.ch</a></p>
  </div>
</body>
</html>
